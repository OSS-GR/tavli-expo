name: User story
description: A feature from the player's point of view
type: Feature
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: "As a <player type>, I want <goal>, so that <reason>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Related docs
      description: Links to docs/ files, ADRs, or designs.
  - type: textarea
    id: notes
    attributes:
      label: Notes
