name: Bug
description: Something does not work as expected
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
  - type: input
    id: device
    attributes:
      label: Device and app version
      placeholder: "iPhone 15, iOS 26.1, app 0.1.0 (build 12)"
