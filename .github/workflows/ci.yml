name: CI

# Lint, typecheck, test and format check on every pull request and on main.
# The job is called `checks`. Require that name in the main branch ruleset.
on:
  pull_request:
  push:
    branches: [main]

# Why there is no `paths-ignore` here:
# `checks` is a required status check. If `paths-ignore` skips the whole
# workflow on a docs-only PR, GitHub never reports `checks`, and the PR waits
# for it forever. So the workflow always runs. The first step looks at the
# changed files. If only docs changed, it skips the rest and the job passes.

permissions:
  contents: read

# A new push to the same PR cancels the old run. Runs on main are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits are enough to diff against the parent (see next step).
          fetch-depth: 2
          persist-credentials: false

      # Docs-only changes: files under docs/ and Markdown under .github/.
      # Prettier ignores both (see .prettierignore), so no check can fail on them.
      # Other Markdown files (README.md, CLAUDE.md) are checked by Prettier,
      # so a change to them still runs everything.
      #
      # On a pull request, HEAD is GitHub's test merge commit. Its first parent
      # is the tip of the base branch, so `HEAD^1..HEAD` is exactly the PR diff.
      # On main, HEAD^1 is the old tip when one PR was merged. If the push held
      # more commits, or anything goes wrong, we run all checks to be safe.
      - name: Detect docs-only changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run_all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          parent=$(git rev-parse --verify --quiet HEAD^1) || run_all "No parent commit. Running all checks."
          if [ "$EVENT" = "push" ] && [ "$parent" != "$BEFORE" ]; then
            run_all "Push has more than one new commit. Running all checks."
          fi

          changed=$(git diff --name-only "$parent" HEAD) || run_all "git diff failed. Running all checks."
          [ -n "$changed" ] || run_all "No changed files found. Running all checks."

          echo "Changed files:"
          echo "$changed"
          while IFS= read -r file; do
            case "$file" in
              docs/*) ;;
              .github/*.md) ;;
              *) run_all "Code or config changed ($file). Running all checks." ;;
            esac
          done <<< "$changed"

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "Only docs changed. Skipping the checks. The job still passes."

      # No `version` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.code == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Expo pins exact React / React Native versions per SDK. This fails when a
      # dependency drifts from what the SDK expects (see #70).
      - name: Expo dependency versions
        if: steps.changes.outputs.code == 'true'
        working-directory: apps/mobile
        run: pnpm exec expo install --check

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: pnpm test

      - name: Format check
        if: steps.changes.outputs.code == 'true'
        run: pnpm format:check

  # Claude code review at high effort (#96). A required check: it fails when
  # Claude finds a blocking problem. It runs on pull requests only, after
  # `checks` passes, so a red PR costs no review.
  #
  # Claude only reads the code. It returns its findings as JSON, and the
  # last step posts them as one PR comment (updated on each push).
  #
  # Skipped (a skipped job counts as passed): drafts, Dependabot PRs (they get
  # no secrets), and PRs from forks. A draft is reviewed when it is marked
  # ready for review.
  claude-review:
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Post and update the findings comment.
      issues: write
      pull-requests: write
      # The Claude action signs in to GitHub as the Claude app through OIDC.
      id-token: write
    steps:
      - name: Check the Claude secret
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::No Claude secret. Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (docs/process/github-workflow.md)."
            exit 1
          fi

      # The PR head, with full history, so `git diff origin/<base>...HEAD` works.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs Claude Code's /code-review at high effort on the PR's changes.
      # It follows CLAUDE.md. It cannot edit files or post: the next step posts.
      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          # The subscription token wins when both secrets are set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: /code-review high origin/${{ github.event.pull_request.base.ref }}...HEAD
          claude_args: |
            --effort high
            --allowedTools "Read,Glob,Grep,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --append-system-prompt "You are the required review gate for this pull request. Do not edit files and do not post anything: the workflow posts your findings. Put every finding you report in the structured output. Mark a finding blocking when it is a correctness bug, a crash, data loss, a security problem, a test that fails or tests nothing, or a break of a hard rule in CLAUDE.md. Mark every other finding optional. Set verdict to fail when there is at least one blocking finding, else pass. Write in simple English: short sentences, active voice."
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["blocking","optional"]},"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"detail":{"type":"string"}},"required":["severity","file","title","detail"]}}},"required":["verdict","summary","findings"]}'

      # Posts the findings as one comment and fails on a blocking finding.
      # The review output is model text, so it goes in through `env`, never
      # straight into the script.
      - name: Post findings and gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.review.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- claude-review -->'

          if [ -n "$OUT" ] && jq -e '.findings | type == "array"' <<< "$OUT" > /dev/null 2>&1; then
            blocking=$(jq '[.findings[] | select(.severity == "blocking")] | length' <<< "$OUT")
            verdict=$(jq -r '.verdict' <<< "$OUT")
            [ "$blocking" -gt 0 ] && verdict=fail
            body=$(jq -r --arg marker "$marker" --arg sha "${SHA:0:7}" --arg run "$RUN_URL" \
              --arg verdict "$verdict" --argjson blocking "$blocking" '
              def loc: "`" + .file + (if .line then ":" + (.line | tostring) else "" end) + "`";
              def item: (if .severity == "blocking" then "🔴 **Blocking**" else "🟡 Optional" end)
                + ": **" + .title + "** " + loc + "\n\n" + .detail + "\n";
              $marker + "\n## Claude review: "
              + (if $verdict == "fail"
                 then "❌ failed (\($blocking) blocking)"
                 else "✅ passed" end)
              + "\n\n" + .summary + "\n\n"
              + (if (.findings | length) == 0 then "No findings.\n"
                 else ([.findings | sort_by(.severity != "blocking") | to_entries[]
                        | "### \(.key + 1). " + (.value | item)] | join("\n")) end)
              + "\n---\n_High-effort review of commit \($sha). [Run log](\($run)). "
              + "Each push re-runs the review._"
              ' <<< "$OUT")
          else
            verdict=fail
            body="$marker
          ## Claude review: ⚠️ did not finish

          The review returned no findings list, so this check fails. Open the [run log]($RUN_URL), fix the cause, and push again."
          fi

          # Update our earlier comment if there is one, so the PR keeps one comment.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

          if [ "$verdict" = "fail" ]; then
            echo "::error::Claude review failed. See the PR comment."
            exit 1
          fi
          echo "Claude review passed."
