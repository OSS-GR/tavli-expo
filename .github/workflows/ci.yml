name: CI

# Lint, typecheck, test and format check on every pull request and on main.
# The work runs in parallel jobs (#248). The last job is called `checks`:
# it passes only when every other job passed or was skipped. Require that
# name in the main branch ruleset; the other job names can change freely.
on:
  pull_request:
  push:
    branches: [main]

# Why there is no `paths-ignore` here:
# `checks` is a required status check. If `paths-ignore` skips the whole
# workflow on a docs-only PR, GitHub never reports `checks`, and the PR waits
# for it forever. So the workflow always runs. The first job looks at the
# changed files. If only docs changed, the other jobs are skipped and
# `checks` passes.

permissions:
  contents: read

# A new push to the same PR cancels the old run. Runs on main are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits are enough to diff against the parent (see next step).
          fetch-depth: 2
          persist-credentials: false

      # Docs-only changes: files under docs/ and Markdown under .github/.
      # Prettier ignores both (see .prettierignore), so no check can fail on them.
      # Other Markdown files (README.md, CLAUDE.md) are checked by Prettier,
      # so a change to them still runs everything.
      #
      # On a pull request, HEAD is GitHub's test merge commit. Its first parent
      # is the tip of the base branch, so `HEAD^1..HEAD` is exactly the PR diff.
      # On main, HEAD^1 is the old tip when one PR was merged. If the push held
      # more commits, or anything goes wrong, we run all checks to be safe.
      - name: Detect docs-only changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run_all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          parent=$(git rev-parse --verify --quiet HEAD^1) || run_all "No parent commit. Running all checks."
          if [ "$EVENT" = "push" ] && [ "$parent" != "$BEFORE" ]; then
            run_all "Push has more than one new commit. Running all checks."
          fi

          changed=$(git diff --name-only "$parent" HEAD) || run_all "git diff failed. Running all checks."
          [ -n "$changed" ] || run_all "No changed files found. Running all checks."

          echo "Changed files:"
          echo "$changed"
          while IFS= read -r file; do
            case "$file" in
              docs/*) ;;
              .github/*.md) ;;
              *) run_all "Code or config changed ($file). Running all checks." ;;
            esac
          done <<< "$changed"

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "Only docs changed. Skipping the checks. The job still passes."

  # Everything except the tests: about a minute of work.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Expo pins exact React / React Native versions per SDK. This fails when a
      # dependency drifts from what the SDK expects (see #70).
      - name: Expo dependency versions
        working-directory: apps/mobile
        run: pnpm exec expo install --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  # Vitest in every workspace but the app. The bot's tests are most of it.
  test-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm -r --filter '!@tavli/mobile' test

  # The app's Jest suites, split by file into shards that run at the same time.
  test-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every shard finish, so one run shows all failing files.
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: test-app (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Test
        working-directory: apps/mobile
        run: pnpm exec jest --shard=${{ matrix.shard }}/2

  # The required check. It fails when any job above failed or was cancelled.
  # A skipped job (docs-only change) counts as passed.
  checks:
    needs: [changes, static, test-packages, test-app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job ended with '$result'."; exit 1 ;;
            esac
          done
