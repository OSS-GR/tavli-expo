name: Sync labels and milestones

# Keeps GitHub labels and milestones in line with .github/labels.json
# and .github/milestones.json. Creates or updates; never deletes.
on:
  push:
    paths:
      - ".github/labels.json"
      - ".github/milestones.json"
      - ".github/workflows/sync-labels.yml"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const labelNames = new Set(existingLabels.map(l => l.name));
            for (const l of labels) {
              if (labelNames.has(l.name)) {
                await github.rest.issues.updateLabel({ owner, repo, name: l.name, color: l.color, description: l.description });
                core.info(`updated label ${l.name}`);
              } else {
                await github.rest.issues.createLabel({ owner, repo, ...l });
                core.info(`created label ${l.name}`);
              }
            }

            const milestones = JSON.parse(fs.readFileSync('.github/milestones.json', 'utf8'));
            const existingMs = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 });
            const byTitle = new Map(existingMs.map(m => [m.title, m]));
            for (const m of milestones) {
              const found = byTitle.get(m.title);
              if (found) {
                await github.rest.issues.updateMilestone({ owner, repo, milestone_number: found.number, description: m.description });
                core.info(`updated milestone #${found.number} ${m.title}`);
              } else {
                const res = await github.rest.issues.createMilestone({ owner, repo, title: m.title, description: m.description });
                core.info(`created milestone #${res.data.number} ${m.title}`);
              }
            }
