name: Web preview

# Builds the web version of the app from a branch and puts it on the dev
# site (#637, ADR-0010), so the owner can test it on a real phone and in
# Safari. Manual only ("Run workflow").
#
# Two jobs, so the branch's code never runs next to the Cloudflare token:
# - build: checks out the branch, builds, uploads the files. No secrets.
# - deploy: takes the files and runs wrangler from main. Has the token.
#
# Never add a `pull_request` or `pull_request_target` trigger: PR code must
# never see the token.
#
# Needs two secrets of the GitHub environment `development`:
# CLOUDFLARE_API_TOKEN (a token that may edit Workers) and
# CLOUDFLARE_ACCOUNT_ID. See docs/process/running-the-app.md, "Web preview".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        default: spike/web-phase0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Skia on the web is CanvasKit. The app loads the file from its root.
      - name: Copy CanvasKit
        working-directory: apps/mobile
        run: |
          mkdir -p public
          if [ ! -f public/canvaskit.wasm ]; then
            cp "$(node -e "console.log(require.resolve('canvaskit-wasm/bin/full/canvaskit.wasm', { paths: [require.resolve('@shopify/react-native-skia/package.json')] }))")" public/canvaskit.wasm
          fi

      # `--clear`: Metro keeps EXPO_PUBLIC_* values in its cache.
      - name: Build
        working-directory: apps/mobile
        run: pnpm exec expo export --clear --platform web --output-dir web-dist

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/mobile/web-dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    # The wrangler config and the header rules come from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - name: Check the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the environment 'development' (see docs/process/running-the-app.md, \"Web preview\")."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/mobile/web
            .nvmrc

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/mobile/web/dist

      - name: Add the header rules
        run: cp apps/mobile/web/_headers apps/mobile/web/dist/_headers

      - name: Deploy
        working-directory: apps/mobile/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.0 deploy
