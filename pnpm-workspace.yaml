packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/adapters/*'

# We use pnpm's default isolated installs. Expo supports them since SDK 54.
# If a native library breaks, Expo's documented fallback is `nodeLinker: hoisted`.

# Build scripts that pnpm may run during install.
allowBuilds:
  # Its postinstall only checks the native binding. Prebuilt binaries ship as optional deps.
  unrs-resolver: false
  # Pulled in by the Jest tool chain. Prebuilt binaries ship as optional deps.
  '@parcel/watcher': false
  # Pulled in by @sentry/react-native. Its postinstall only downloads the CLI
  # binary when the prebuilt one (an optional dep) is missing.
  '@sentry/cli': false
  # Pulled in by convex (apps/server). Its postinstall only checks the native
  # binary. Prebuilt binaries ship as optional deps.
  esbuild: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.22'
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-server@58.1.0
  - expo@58.0.24
  - expo-apple-authentication@58.0.3
  - expo-audio@58.0.12
  - expo-dev-client@58.0.19
  - expo-dev-launcher@58.0.19
  - expo-dev-menu-interface@58.0.2
  - expo-dev-menu@58.0.13
  - expo-haptics@58.0.8
  - expo-linking@58.0.17
  - expo-network@58.0.5
  - expo-notifications@58.1.9
  - expo-router@58.0.31
  - expo-secure-store@58.0.3
  - expo-splash-screen@58.0.14
  - expo-status-bar@58.0.5
  - expo-updates@58.0.22

