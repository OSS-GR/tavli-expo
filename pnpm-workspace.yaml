packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/adapters/*'

# We use pnpm's default isolated installs. Expo supports them since SDK 54.
# If a native library breaks, Expo's documented fallback is `nodeLinker: hoisted`.

# Build scripts that pnpm may run during install.
allowBuilds:
  # Its postinstall only checks the native binding. Prebuilt binaries ship as optional deps.
  unrs-resolver: false
  # Pulled in by the Jest tool chain. Prebuilt binaries ship as optional deps.
  '@parcel/watcher': false
  # Pulled in by @sentry/react-native. Its postinstall only downloads the CLI
  # binary when the prebuilt one (an optional dep) is missing.
  '@sentry/cli': false
